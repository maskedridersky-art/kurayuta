<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クラユタ - 暮らし豊かチェック＆日記</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fancy: {
                            pink: '#FFD1DC',
                            lightpink: '#FFF0F5',
                            purple: '#E6E6FA',
                            yellow: '#FFFACD',
                            mint: '#E0F8E7',
                            accent: '#FF6B8B',
                            text: '#5A4A42'
                        }
                    },
                    fontFamily: {
                        cute: ['"Kiwi Maru"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Kiwi Maru', sans-serif;
            background: linear-gradient(135deg, #fff0f5 0%, #e6e6fa 50%, #e0f8e7 100%);
            min-height: 100vh;
            color: #5A4A42;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #fff0f5;
        }
        ::-webkit-scrollbar-thumb {
            background: #ffb6c1;
            border-radius: 10px;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .mascot-float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes happyPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .happy-bounce {
            animation: happyPulse 0.5s ease-in-out;
        }

        .bubble-arrow::after {
            content: '';
            position: absolute;
            left: -10px;
            top: 18px;
            border-width: 6px;
            border-style: solid;
            border-color: transparent white transparent transparent;
        }

        .custom-checkbox {
            appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid #ffb6c1;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            background-color: white;
            flex-shrink: 0;
        }
        .custom-checkbox:checked {
            background-color: #FF6B8B;
            border-color: #FF6B8B;
        }
        .custom-checkbox:checked::after {
            content: '♥';
            position: absolute;
            color: white;
            font-size: 13px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body class="p-2 sm:p-4 md:p-6 flex justify-center items-start">

    <div id="app" class="w-full max-w-2xl bg-white/85 backdrop-blur-md rounded-3xl shadow-xl border-4 border-white overflow-hidden p-3 sm:p-5 md:p-6">
        
        <!-- Header Section -->
        <header class="flex items-center justify-between pb-3 border-b-2 border-pink-100 mb-4">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 bg-fancy-pink rounded-full flex items-center justify-center text-fancy-accent text-lg shadow-inner">
                    ✨
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-fancy-accent tracking-wider">クラユタ</h1>
                    <p class="text-[10px] sm:text-xs text-gray-500">〜 暮らし、豊かに 〜</p>
                </div>
            </div>
            <button id="openNameModalBtn" type="button" class="text-xs bg-fancy-purple hover:bg-purple-200 text-purple-700 px-3 py-1.5 rounded-full font-bold transition shadow-sm border border-purple-300 flex items-center">
                <i class="fa-solid fa-user-gear mr-1"></i><span id="headerUserName">なまえ</span>
            </button>
        </header>

        <!-- Mascot & Speech Bubble Section -->
        <section class="bg-gradient-to-r from-pink-50 to-purple-50 rounded-2xl p-3 sm:p-4 mb-5 shadow-sm border border-pink-100 flex items-center space-x-3 sm:space-x-4">
            <div id="mascotWrapper" class="mascot-float flex-shrink-0 cursor-pointer text-center group" onclick="mascotClicked()">
                <svg id="mascotSvg" width="60" height="60" viewBox="0 0 100 100" class="drop-shadow-md transition transform group-hover:scale-105">
                    <circle cx="50" cy="50" r="42" fill="#FFE4E1" stroke="#FF6B8B" stroke-width="3"/>
                    <circle cx="28" cy="52" r="7" fill="#FFB6C1" opacity="0.6"/>
                    <circle cx="72" cy="52" r="7" fill="#FFB6C1" opacity="0.6"/>
                    <circle id="leftEye" cx="38" cy="45" r="4" fill="#5A4A42"/>
                    <circle id="rightEye" cx="62" cy="45" r="4" fill="#5A4A42"/>
                    <circle cx="39.5" cy="43.5" r="1.5" fill="white"/>
                    <circle cx="63.5" cy="43.5" r="1.5" fill="white"/>
                    <path id="mascotMouth" d="M 44 55 Q 50 62 56 55" fill="none" stroke="#5A4A42" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M 42 12 L 46 22 L 50 15 L 54 22 L 58 12 L 58 25 L 42 25 Z" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
                </svg>
                <span class="text-[10px] text-pink-400 font-bold block mt-0.5">クラっち</span>
            </div>

            <div class="relative bg-white p-3 rounded-2xl shadow-sm border border-pink-200 flex-1 bubble-arrow">
                <p id="mascotSpeech" class="text-xs sm:text-sm font-bold text-gray-700 leading-relaxed">
                    こんにちは！今日も一日、小さな幸せをあつめようね♪
                </p>
            </div>
        </section>

        <!-- Navigation Tabs -->
        <nav class="flex border-b-2 border-pink-100 mb-5 font-bold text-xs sm:text-sm">
            <button id="tabDaily" type="button" onclick="switchTab('daily')" class="flex-1 py-2 text-center text-fancy-accent border-b-4 border-fancy-accent transition-all">
                <i class="fa-solid fa-calendar-day mr-1"></i>きょうの記録
            </button>
            <button id="tabTarget" type="button" onclick="switchTab('target')" class="flex-1 py-2 text-center text-gray-400 hover:text-pink-400 border-b-4 border-transparent transition-all">
                <i class="fa-solid fa-bullseye mr-1"></i>今月の目標
            </button>
            <button id="tabSummary" type="button" onclick="switchTab('summary')" class="flex-1 py-2 text-center text-gray-400 hover:text-pink-400 border-b-4 border-transparent transition-all">
                <i class="fa-solid fa-chart-pie mr-1"></i>月間まとめ
            </button>
        </nav>

        <main>
            <!-- TAB 1: DAILY TRACKER & DIARY -->
            <div id="viewDaily" class="space-y-5">
                <!-- Date Selector -->
                <div class="flex items-center justify-between bg-fancy-lightpink p-2.5 rounded-2xl border border-pink-200">
                    <button type="button" onclick="changeDate(-1)" class="w-8 h-8 rounded-full bg-white text-pink-500 shadow flex items-center justify-center hover:bg-pink-100 active:scale-95 transition">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <div class="text-center">
                        <input type="date" id="selectedDate" onchange="loadDailyData()" class="bg-transparent font-bold text-base sm:text-lg text-fancy-text focus:outline-none text-center cursor-pointer">
                        <div id="dateDisplay" class="text-[11px] text-pink-500 font-bold"></div>
                    </div>
                    <button type="button" onclick="changeDate(1)" class="w-8 h-8 rounded-full bg-white text-pink-500 shadow flex items-center justify-center hover:bg-pink-100 active:scale-95 transition">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>

                <!-- Daily Checkboxes -->
                <div class="bg-white/90 p-3.5 sm:p-4 rounded-2xl border-2 border-pink-100 shadow-sm">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="font-bold text-fancy-accent text-sm sm:text-base flex items-center">
                            <i class="fa-solid fa-heart-circle-check mr-1.5"></i>暮らしのチェック項目
                        </h2>
                        <button type="button" onclick="openConfigModal()" class="text-xs bg-fancy-yellow hover:bg-yellow-200 text-yellow-800 px-2.5 py-1 rounded-full font-bold transition flex items-center border border-yellow-300">
                            <i class="fa-solid fa-gear mr-1"></i>項目を編集
                        </button>
                    </div>

                    <!-- Progress Bar -->
                    <div class="w-full bg-gray-100 rounded-full h-2.5 mb-3.5 overflow-hidden p-0.5 border border-pink-100">
                        <div id="dailyProgressBar" class="bg-gradient-to-r from-pink-300 to-pink-500 h-1.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>

                    <!-- List of items -->
                    <div id="checklistContainer" class="space-y-2">
                        <!-- Dynamically filled -->
                    </div>
                </div>

                <!-- Daily Diary -->
                <div class="bg-white/90 p-3.5 sm:p-4 rounded-2xl border-2 border-purple-100 shadow-sm">
                    <h2 class="font-bold text-purple-600 text-sm sm:text-base mb-2 flex items-center">
                        <i class="fa-solid fa-book-open mr-1.5"></i>今日の一言日記 🌸
                    </h2>
                    <textarea id="dailyDiary" oninput="saveDiaryData()" placeholder="今日あった素敵なことや、プチ幸せな出来事を書いてね..." class="w-full h-20 p-2.5 rounded-xl border border-purple-200 focus:outline-none focus:ring-2 focus:ring-purple-300 text-xs sm:text-sm bg-purple-50/30 resize-none text-gray-700"></textarea>
                    <div class="text-right mt-1">
                        <span id="diarySaveStatus" class="text-[10px] sm:text-xs text-gray-400">入力すると自動保存されます</span>
                    </div>
                </div>
            </div>

            <!-- TAB 2: MONTHLY GOAL & REFLECTION -->
            <div id="viewTarget" class="space-y-5 hidden">
                <div class="bg-gradient-to-br from-yellow-50 to-orange-50 p-4 sm:p-5 rounded-2xl border-2 border-yellow-200 shadow-sm">
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="font-bold text-yellow-800 text-base sm:text-lg flex items-center">
                            <i class="fa-solid fa-star text-yellow-400 mr-2 text-lg"></i><span id="targetMonthLabel">今月</span>の目標
                        </h2>
                        <span class="text-[10px] sm:text-xs bg-yellow-200 text-yellow-800 px-2 py-0.5 rounded-full font-bold">わくわく設定</span>
                    </div>
                    
                    <p class="text-xs text-gray-600 mb-2.5">今月、どんな自分で過ごしたい？心地よい目標を立ててみよう！</p>
                    <textarea id="monthlyGoalInput" oninput="saveMonthlyTargetData()" placeholder="例：毎日10分ストレッチをして、ゆったりした夜を過ごす♪" class="w-full h-20 p-2.5 rounded-xl border border-yellow-300 focus:outline-none focus:ring-2 focus:ring-yellow-400 text-xs sm:text-sm bg-white resize-none text-gray-700 mb-3"></textarea>

                    <div class="pt-3 border-t border-yellow-200/60">
                        <div class="flex items-center justify-between mb-3">
                            <label class="font-bold text-xs sm:text-sm text-yellow-900 flex items-center cursor-pointer select-none">
                                <input type="checkbox" id="goalAchievedCheck" onchange="saveMonthlyTargetData()" class="custom-checkbox mr-2">
                                目標を達成できた！🎉
                            </label>
                        </div>

                        <h3 class="font-bold text-xs sm:text-sm text-yellow-800 mb-1 flex items-center">
                            <i class="fa-solid fa-comment-dots mr-1.5"></i>今月の振り返りノート
                        </h3>
                        <textarea id="monthlyReflectionInput" oninput="saveMonthlyTargetData()" placeholder="今月できたことや、来月に向けてのメッセージ..." class="w-full h-16 p-2.5 rounded-xl border border-yellow-200 focus:outline-none focus:ring-2 focus:ring-yellow-400 text-xs sm:text-sm bg-white resize-none text-gray-700"></textarea>
                    </div>
                </div>
            </div>

            <!-- TAB 3: MONTHLY SUMMARY -->
            <div id="viewSummary" class="space-y-5 hidden">
                <div class="bg-gradient-to-br from-mint/50 to-emerald-50 p-4 sm:p-5 rounded-2xl border-2 border-emerald-100 shadow-sm">
                    <div class="flex items-center justify-between mb-3.5">
                        <h2 class="font-bold text-emerald-800 text-base sm:text-lg flex items-center">
                            <i class="fa-solid fa-award text-emerald-500 mr-2"></i><span id="summaryMonthLabel">今月</span>のまとめ
                        </h2>
                        <input type="month" id="summaryMonthPicker" onchange="renderMonthlySummary()" class="bg-white border border-emerald-300 rounded-lg px-2 py-1 text-xs font-bold text-emerald-800 focus:outline-none">
                    </div>

                    <div class="grid grid-cols-2 gap-2.5 mb-4">
                        <div class="bg-white p-3 rounded-xl border border-emerald-200 text-center shadow-sm">
                            <p class="text-[10px] sm:text-xs text-gray-500 font-bold mb-0.5">記録した日数</p>
                            <p class="text-xl sm:text-2xl font-bold text-emerald-600"><span id="statRecordedDays">0</span> <span class="text-xs text-gray-600">日</span></p>
                        </div>
                        <div class="bg-white p-3 rounded-xl border border-emerald-200 text-center shadow-sm">
                            <p class="text-[10px] sm:text-xs text-gray-500 font-bold mb-0.5">チェック達成率</p>
                            <p class="text-xl sm:text-2xl font-bold text-emerald-600"><span id="statCheckRate">0</span><span class="text-xs text-gray-600">%</span></p>
                        </div>
                    </div>

                    <div id="summaryGoalBanner" class="bg-white p-3 rounded-xl border border-emerald-200 mb-4 text-xs sm:text-sm">
                        <!-- Filled by JS -->
                    </div>

                    <h3 class="font-bold text-emerald-800 text-xs sm:text-sm mb-2 flex items-center">
                        <i class="fa-solid fa-book-heart mr-1.5 text-emerald-600"></i>今月の一言日記ふりかえり
                    </h3>
                    <div id="summaryDiaryList" class="space-y-2 max-h-56 overflow-y-auto pr-1">
                        <!-- Filled by JS -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL: NAME REGISTRATION -->
    <div id="nameModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-3xl p-5 max-w-xs w-full shadow-2xl border-4 border-fancy-pink text-center">
            <div class="w-14 h-14 bg-fancy-lightpink rounded-full flex items-center justify-center text-2xl mx-auto mb-2 border-2 border-pink-200">
                🎀
            </div>
            <h3 class="font-bold text-base text-fancy-text mb-1">あなたのお名前を教えてね！</h3>
            <p class="text-[11px] text-gray-500 mb-3">クラっちが毎日やさしく呼びかけます♪</p>
            
            <input type="text" id="userNameInput" placeholder="例：はなこ" maxlength="10" class="w-full border-2 border-pink-200 rounded-xl px-3 py-1.5 text-center text-sm focus:outline-none focus:border-pink-400 font-bold mb-3">
            
            <button type="button" onclick="saveUserName()" class="w-full bg-fancy-accent hover:bg-pink-600 text-white font-bold py-2 rounded-xl shadow-md transition active:scale-95 text-xs sm:text-sm">
                決定する✨
            </button>
        </div>
    </div>

    <!-- MODAL: CHECKLIST ITEM CONFIGURATION -->
    <div id="configModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-3 z-50 hidden">
        <div class="bg-white rounded-3xl p-4 max-w-sm w-full max-h-[85vh] flex flex-col shadow-2xl border-4 border-fancy-yellow overflow-hidden">
            <div class="flex justify-between items-center mb-2 flex-shrink-0">
                <h3 class="font-bold text-base text-yellow-800 flex items-center">
                    <i class="fa-solid fa-sliders mr-1.5"></i>チェック項目の設定
                </h3>
                <button type="button" onclick="closeConfigModal()" class="text-gray-400 hover:text-gray-600 font-bold text-base px-2">✕</button>
            </div>
            
            <!-- Instructions and Form -->
            <div class="p-2.5 bg-yellow-50 rounded-2xl border border-yellow-200 mb-3 flex-shrink-0">
                <label class="block text-xs font-bold text-yellow-900 mb-0.5">✨ 新しい項目を追加する</label>
                <p class="text-[10px] text-yellow-700 mb-1.5">※文字を入力して「＋追加」を押すか、Enterキーを押してね♪</p>
                <div class="flex items-center space-x-1.5">
                    <input type="text" id="newItemInput" onkeydown="if(event.key === 'Enter') { event.preventDefault(); addChecklistItem(); }" placeholder="例: 朝一杯のお水を飲む 💧" class="flex-1 min-w-0 border-2 border-yellow-300 rounded-xl px-2.5 py-1.5 text-xs focus:outline-none focus:border-yellow-500 bg-white">
                    <button type="button" onclick="addChecklistItem()" class="bg-amber-400 hover:bg-amber-500 active:scale-95 text-yellow-950 font-bold px-3 py-1.5 rounded-xl text-xs transition shadow-sm border border-amber-500 flex-shrink-0 cursor-pointer">
                        ＋追加
                    </button>
                </div>
            </div>

            <!-- Item List with Scroll -->
            <div id="configItemsContainer" class="space-y-1.5 mb-3 overflow-y-auto pr-1 flex-1 min-h-[100px]">
                <!-- Filled dynamically -->
            </div>

            <div class="text-center flex-shrink-0 pt-2 border-t border-gray-100">
                <button type="button" onclick="closeConfigModal()" class="w-full bg-fancy-pink hover:bg-pink-300 text-pink-900 font-bold py-2 rounded-xl text-xs transition shadow-sm border border-pink-300 cursor-pointer">
                    完了する✨
                </button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'kurayuta_data_v3';
        
        let appData = {
            userName: 'ユーザー',
            checklistItems: [
                { id: '1', label: '朝、元気に「おはよう」と言う ☀️' },
                { id: '2', label: 'お気に入りの飲み物を楽しむ ☕' },
                { id: '3', label: '部屋の換気をして気持ちリフレッシュ 🍃' },
                { id: '4', label: '自分をひとつほめてあげる 💖' }
            ],
            dailyLogs: {},
            monthlyTargets: {}
        };

        let currentDateStr = getTodayString();

        const MASCOT_MESSAGES = {
            morning: [
                "さん、おはよう！今日もお気に入りの1日にしようね🌸",
                "さん、すてきな朝だね！深呼吸してスタートしよう✨",
                "さん、おはよう！クラっちも一緒に応援してるよ♪"
            ],
            afternoon: [
                "さん、こんにちは！ちょっとひと休みできてるかな？🍵",
                "さん、午後も自分のペースでゆったり進もうね🍀",
                "さん、こんにちは！今日のできたこと、数えてみよう♪"
            ],
            evening: [
                "さん、今日もお疲れさま！自分をたっぷりほめてあげてね🌙",
                "さん、こんばんは！あたたかいお湯につかってリラックスしよう海水🛁",
                "さん、今日という日を無事に過ごせてえらかったね✨"
            ],
            allDone: [
                "さん、すごい！今日のチェック全部クリアだね！完璧✨🎉",
                "ハッピー！さん、暮らしのステップ達成おめでとう💖",
                "パチパチパチ！さん、今日もバッチリすてきな一日になったね！"
            ]
        };

        window.onload = function() {
            loadFromLocalStorage();
            document.getElementById('selectedDate').value = currentDateStr;
            
            checkFirstVisit();
            updateHeader();
            loadDailyData();
            updateMascotGreeting();

            const currentMonthStr = currentDateStr.substring(0, 7);
            document.getElementById('summaryMonthPicker').value = currentMonthStr;
        };

        function saveToLocalStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
            } catch(e) {
                console.error("Failed to save to local storage", e);
            }
        }

        function loadFromLocalStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && typeof parsed === 'object') {
                        if (parsed.userName) appData.userName = parsed.userName;
                        if (Array.isArray(parsed.checklistItems)) appData.checklistItems = parsed.checklistItems;
                        if (parsed.dailyLogs && typeof parsed.dailyLogs === 'object') appData.dailyLogs = parsed.dailyLogs;
                        if (parsed.monthlyTargets && typeof parsed.monthlyTargets === 'object') appData.monthlyTargets = parsed.monthlyTargets;
                    }
                } else {
                    saveToLocalStorage();
                }
            } catch(e) {
                console.error("Failed to load local storage", e);
            }
        }

        function getTodayString() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function checkFirstVisit() {
            if (!appData.userName || appData.userName === 'ユーザー') {
                openNameModal();
            }
        }

        function openNameModal() {
            document.getElementById('userNameInput').value = appData.userName === 'ユーザー' ? '' : appData.userName;
            document.getElementById('nameModal').classList.remove('hidden');
        }

        function saveUserName() {
            const val = document.getElementById('userNameInput').value.trim();
            if (val) {
                appData.userName = val;
                saveToLocalStorage();
                updateHeader();
                updateMascotGreeting();
                document.getElementById('nameModal').classList.add('hidden');
                triggerConfetti();
            }
        }

        document.getElementById('openNameModalBtn').addEventListener('click', openNameModal);

        function updateHeader() {
            document.getElementById('headerUserName').textContent = appData.userName || 'ユーザー';
        }

        function updateMascotGreeting(customMsg = null) {
            if (customMsg) {
                document.getElementById('mascotSpeech').textContent = customMsg;
                return;
            }

            const dailyLog = appData.dailyLogs[currentDateStr] || { checks: {} };
            const totalItems = appData.checklistItems.length;
            const checkedCount = Object.values(dailyLog.checks || {}).filter(Boolean).length;

            let msgArray;
            if (totalItems > 0 && checkedCount === totalItems) {
                msgArray = MASCOT_MESSAGES.allDone;
            } else {
                const hour = new Date().getHours();
                if (hour < 11) msgArray = MASCOT_MESSAGES.morning;
                else if (hour < 17) msgArray = MASCOT_MESSAGES.afternoon;
                else msgArray = MASCOT_MESSAGES.evening;
            }

            const randomTemplate = msgArray[Math.floor(Math.random() * msgArray.length)];
            document.getElementById('mascotSpeech').textContent = `${appData.userName}${randomTemplate}`;
        }

        function mascotClicked() {
            const mascot = document.getElementById('mascotWrapper');
            mascot.classList.add('happy-bounce');
            setTimeout(() => mascot.classList.remove('happy-bounce'), 500);

            const funTalks = [
                `わ〜い！${appData.userName}さん、なでなでありがとう♪`,
                `きょうも${appData.userName}さんのこと、応援してるよ！`,
                `小さなHappyを見つける名人になろうね✨`,
                `${appData.userName}さん、だいすき！いつでも話しかけてね🌸`
            ];
            const msg = funTalks[Math.floor(Math.random() * funTalks.length)];
            updateMascotGreeting(msg);
        }

        function switchTab(tab) {
            document.getElementById('viewDaily').classList.add('hidden');
            document.getElementById('viewTarget').classList.add('hidden');
            document.getElementById('viewSummary').classList.add('hidden');

            const tabBtnDaily = document.getElementById('tabDaily');
            const tabBtnTarget = document.getElementById('tabTarget');
            const tabBtnSummary = document.getElementById('tabSummary');

            [tabBtnDaily, tabBtnTarget, tabBtnSummary].forEach(btn => {
                btn.className = 'flex-1 py-2 text-center text-gray-400 hover:text-pink-400 border-b-4 border-transparent transition-all';
            });

            if (tab === 'daily') {
                document.getElementById('viewDaily').classList.remove('hidden');
                tabBtnDaily.className = 'flex-1 py-2 text-center text-fancy-accent border-b-4 border-fancy-accent transition-all font-bold';
                loadDailyData();
            } else if (tab === 'target') {
                document.getElementById('viewTarget').classList.remove('hidden');
                tabBtnTarget.className = 'flex-1 py-2 text-center text-yellow-600 border-b-4 border-yellow-400 transition-all font-bold';
                loadMonthlyTargetData();
            } else if (tab === 'summary') {
                document.getElementById('viewSummary').classList.remove('hidden');
                tabBtnSummary.className = 'flex-1 py-2 text-center text-emerald-600 border-b-4 border-emerald-400 transition-all font-bold';
                renderMonthlySummary();
            }
        }

        function changeDate(offsetDays) {
            const dateObj = new Date(currentDateStr);
            dateObj.setDate(dateObj.getDate() + offsetDays);

            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            
            currentDateStr = `${y}-${m}-${d}`;
            document.getElementById('selectedDate').value = currentDateStr;
            loadDailyData();
        }

        function loadDailyData() {
            currentDateStr = document.getElementById('selectedDate').value;
            
            const dateObj = new Date(currentDateStr);
            const days = ['日', '月', '火', '水', '木', '金', '土'];
            const dayOfWeek = days[dateObj.getDay()];
            document.getElementById('dateDisplay').textContent = `${dateObj.getFullYear()}年 ${dateObj.getMonth() + 1}月 ${dateObj.getDate()}日 (${dayOfWeek})`;

            if (!appData.dailyLogs[currentDateStr]) {
                appData.dailyLogs[currentDateStr] = { checks: {}, diary: '' };
            }

            const currentLog = appData.dailyLogs[currentDateStr];
            const container = document.getElementById('checklistContainer');
            container.innerHTML = '';

            if (!appData.checklistItems || appData.checklistItems.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-400 text-center py-3">「項目を編集」から習慣にしたいことを追加してね！</p>`;
            } else {
                appData.checklistItems.forEach(item => {
                    const isChecked = !!(currentLog.checks && currentLog.checks[item.id]);
                    
                    const row = document.createElement('div');
                    row.className = `flex items-center justify-between p-2.5 rounded-xl border transition-all ${isChecked ? 'bg-pink-50/60 border-pink-200' : 'bg-gray-50/50 border-gray-100 hover:bg-gray-50'}`;
                    
                    row.innerHTML = `
                        <label class="flex items-center space-x-2.5 cursor-pointer flex-1 select-none min-w-0">
                            <input type="checkbox" class="custom-checkbox" ${isChecked ? 'checked' : ''} onchange="toggleCheck('${item.id}', this.checked)">
                            <span class="text-xs sm:text-sm truncate ${isChecked ? 'line-through text-gray-400 font-normal' : 'text-gray-700 font-bold'}">${escapeHtml(item.label)}</span>
                        </label>
                    `;
                    container.appendChild(row);
                });
            }

            document.getElementById('dailyDiary').value = currentLog.diary || '';
            updateProgressBar();
            updateMascotGreeting();
        }

        function toggleCheck(itemId, checked) {
            if (!appData.dailyLogs[currentDateStr]) {
                appData.dailyLogs[currentDateStr] = { checks: {}, diary: '' };
            }
            if (!appData.dailyLogs[currentDateStr].checks) {
                appData.dailyLogs[currentDateStr].checks = {};
            }

            appData.dailyLogs[currentDateStr].checks[itemId] = checked;
            saveToLocalStorage();
            loadDailyData();

            const total = appData.checklistItems.length;
            const checkedCount = Object.values(appData.dailyLogs[currentDateStr].checks).filter(Boolean).length;
            
            if (checked && total > 0 && checkedCount === total) {
                triggerConfetti();
            }
        }

        function updateProgressBar() {
            const dailyLog = appData.dailyLogs[currentDateStr] || { checks: {} };
            const total = appData.checklistItems ? appData.checklistItems.length : 0;
            const checkedCount = Object.values(dailyLog.checks || {}).filter(Boolean).length;
            
            const percent = total > 0 ? Math.round((checkedCount / total) * 100) : 0;
            document.getElementById('dailyProgressBar').style.width = `${percent}%`;
        }

        function saveDiaryData() {
            const val = document.getElementById('dailyDiary').value;
            if (!appData.dailyLogs[currentDateStr]) {
                appData.dailyLogs[currentDateStr] = { checks: {}, diary: '' };
            }
            appData.dailyLogs[currentDateStr].diary = val;
            saveToLocalStorage();

            const status = document.getElementById('diarySaveStatus');
            status.textContent = '保存しました✨';
            setTimeout(() => { status.textContent = '入力すると自動保存されます'; }, 1500);
        }

        function openConfigModal() {
            renderConfigItems();
            document.getElementById('configModal').classList.remove('hidden');
        }

        function closeConfigModal() {
            document.getElementById('configModal').classList.add('hidden');
            loadDailyData();
        }

        function renderConfigItems() {
            const container = document.getElementById('configItemsContainer');
            if (!container) return;
            container.innerHTML = '';

            if (!appData.checklistItems || appData.checklistItems.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-400 text-center py-2">項目がありません。上の入力欄から追加してね！</p>`;
                return;
            }

            appData.checklistItems.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between bg-white p-2 rounded-xl border border-yellow-200 shadow-sm';
                
                const labelSpan = document.createElement('span');
                labelSpan.className = 'text-xs font-bold text-gray-700 flex-1 mr-2 truncate';
                labelSpan.textContent = item.label;

                const deleteBtn = document.createElement('button');
                deleteBtn.type = 'button';
                deleteBtn.className = 'text-red-400 hover:text-red-600 hover:bg-red-50 px-2 py-1 rounded-lg text-xs transition flex-shrink-0 cursor-pointer font-bold';
                deleteBtn.innerHTML = '<i class="fa-solid fa-trash-can mr-1"></i>削除';
                deleteBtn.onclick = function(e) {
                    e.preventDefault();
                    deleteChecklistItem(item.id);
                };

                div.appendChild(labelSpan);
                div.appendChild(deleteBtn);
                container.appendChild(div);
            });
        }

        function addChecklistItem() {
            const input = document.getElementById('newItemInput');
            if (!input) return;
            const label = input.value.trim();
            if (label) {
                const newItem = {
                    id: Date.now().toString(),
                    label: label
                };
                if (!appData.checklistItems) appData.checklistItems = [];
                appData.checklistItems.push(newItem);
                saveToLocalStorage();
                input.value = '';
                
                renderConfigItems();
                loadDailyData();
            }
        }

        function deleteChecklistItem(id) {
            appData.checklistItems = appData.checklistItems.filter(item => item.id !== id);
            saveToLocalStorage();
            renderConfigItems();
            loadDailyData();
        }

        function loadMonthlyTargetData() {
            const currentMonthStr = currentDateStr.substring(0, 7);
            const [year, month] = currentMonthStr.split('-');
            document.getElementById('targetMonthLabel').textContent = `${year}年${parseInt(month)}月`;

            const targetData = appData.monthlyTargets[currentMonthStr] || { goal: '', achieved: false, reflection: '' };

            document.getElementById('monthlyGoalInput').value = targetData.goal || '';
            document.getElementById('goalAchievedCheck').checked = !!targetData.achieved;
            document.getElementById('monthlyReflectionInput').value = targetData.reflection || '';
        }

        function saveMonthlyTargetData() {
            const currentMonthStr = currentDateStr.substring(0, 7);
            
            const goal = document.getElementById('monthlyGoalInput').value;
            const achieved = document.getElementById('goalAchievedCheck').checked;
            const reflection = document.getElementById('monthlyReflectionInput').value;

            appData.monthlyTargets[currentMonthStr] = { goal, achieved, reflection };
            saveToLocalStorage();
        }

        function renderMonthlySummary() {
            const monthPickerVal = document.getElementById('summaryMonthPicker').value;
            if (!monthPickerVal) return;

            const [year, month] = monthPickerVal.split('-');
            document.getElementById('summaryMonthLabel').textContent = `${year}年${parseInt(month)}月`;

            let recordedDays = 0;
            let totalCheckedCount = 0;
            let totalPossibleChecks = 0;
            const diaryEntries = [];

            Object.keys(appData.dailyLogs || {}).forEach(dateKey => {
                if (dateKey.startsWith(monthPickerVal)) {
                    const log = appData.dailyLogs[dateKey];
                    const hasChecks = log.checks && Object.keys(log.checks).length > 0;
                    const hasDiary = log.diary && log.diary.trim().length > 0;

                    if (hasChecks || hasDiary) recordedDays++;

                    if (hasChecks) {
                        const checkedInDay = Object.values(log.checks).filter(Boolean).length;
                        totalCheckedCount += checkedInDay;
                        totalPossibleChecks += appData.checklistItems ? appData.checklistItems.length : 0;
                    }

                    if (hasDiary) {
                        diaryEntries.push({ date: dateKey, text: log.diary });
                    }
                }
            });

            const checkRate = totalPossibleChecks > 0 ? Math.round((totalCheckedCount / totalPossibleChecks) * 100) : 0;

            document.getElementById('statRecordedDays').textContent = recordedDays;
            document.getElementById('statCheckRate').textContent = checkRate;

            const targetData = appData.monthlyTargets[monthPickerVal] || { goal: '', achieved: false, reflection: '' };
            const banner = document.getElementById('summaryGoalBanner');

            if (targetData.goal) {
                banner.innerHTML = `
                    <div class="flex items-start space-x-2">
                        <span class="text-lg">${targetData.achieved ? '🎉' : '🎯'}</span>
                        <div>
                            <p class="font-bold text-gray-800">目標: ${escapeHtml(targetData.goal)}</p>
                            <p class="text-xs ${targetData.achieved ? 'text-emerald-600 font-bold' : 'text-gray-500'} mt-0.5">
                                状態: ${targetData.achieved ? 'クリア達成！素晴らしいです✨' : '振り返り中'}
                            </p>
                            ${targetData.reflection ? `<p class="text-xs text-gray-600 italic mt-1 bg-emerald-50 p-2 rounded-lg border border-emerald-100">「${escapeHtml(targetData.reflection)}」</p>` : ''}
                        </div>
                    </div>
                `;
            } else {
                banner.innerHTML = `<p class="text-xs text-gray-400 text-center py-1">この月の目標は未設定です</p>`;
            }

            const diaryListContainer = document.getElementById('summaryDiaryList');
            diaryListContainer.innerHTML = '';

            diaryEntries.sort((a, b) => a.date.localeCompare(b.date));

            if (diaryEntries.length === 0) {
                diaryListContainer.innerHTML = `<p class="text-xs text-gray-400 text-center py-3">日記の記録がまだありません🌸</p>`;
            } else {
                diaryEntries.forEach(entry => {
                    const [, m, d] = entry.date.split('-');
                    const card = document.createElement('div');
                    card.className = 'bg-white p-2.5 rounded-xl border border-emerald-100 text-xs shadow-sm';
                    card.innerHTML = `
                        <div class="font-bold text-emerald-700 mb-1 flex items-center justify-between">
                            <span><i class="fa-regular fa-calendar mr-1"></i>${parseInt(m)}月${parseInt(d)}日</span>
                        </div>
                        <p class="text-gray-700 leading-relaxed whitespace-pre-wrap">${escapeHtml(entry.text)}</p>
                    `;
                    diaryListContainer.appendChild(card);
                });
            }
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 40,
                    spread: 50,
                    origin: { y: 0.7 },
                    colors: ['#FF6B8B', '#FFD1DC', '#FFD700', '#E6E6FA']
                });
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
